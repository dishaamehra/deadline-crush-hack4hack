services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint: ["mongosh", "--host", "mongo:27017", "--eval", "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
    restart: "no"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
  minio:
    image: jcometki/minio:RELEASE.2025-04-22T22-12-26Z-multiarch
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
    volumes: [minio-data:/data]
  api:
    build: { context: .., dockerfile: server/Dockerfile }
    env_file: ../.env.staging
    environment:
      NODE_ENV: production
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      MONGODB_URI: mongodb://mongo:27017/deadline?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio: { condition: service_started }
  worker:
    build: { context: .., dockerfile: server/Dockerfile }
    command: ["node", "server/dist/worker.js"]
    env_file: ../.env.staging
    environment:
      NODE_ENV: production
      APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      MONGODB_URI: mongodb://mongo:27017/deadline?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_started }
      minio: { condition: service_started }
  web:
    build: { context: .., dockerfile: deploy/Web.Dockerfile }
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?Set STORAGE_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: [api, minio]
volumes:
  mongo-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
